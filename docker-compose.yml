# Whole stack: two mock OpenAI-compatible providers + the Prism gateway.
#   docker compose up --build -d
#   open http://localhost:8080/console        (admin token: prism-admin-demo)
x-image: &image
  image: prism-gateway:local
  build: .

services:
  alpha:
    <<: *image
    command: ["python", "scripts/mock_provider.py", "--port", "9001", "--name", "alpha"]
    ports: ["9001:9001"]          # published so you can inject failures from the host (POST /admin/config)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  beta:
    <<: *image
    command: ["python", "scripts/mock_provider.py", "--port", "9002", "--name", "beta"]
    ports: ["9002:9002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  prism:
    <<: *image
    depends_on:
      alpha: { condition: service_healthy }
      beta: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      PRISM_ADMIN_TOKEN: ${PRISM_ADMIN_TOKEN:-prism-admin-demo}   # change for anything but a local demo
      PRISM_UPSTREAM_TIMEOUT_MS: ${PRISM_UPSTREAM_TIMEOUT_MS:-2000}
    volumes:
      - prism-data:/data

volumes:
  prism-data:
